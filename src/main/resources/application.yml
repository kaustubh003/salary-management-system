spring:
  application:
    name: acme-salary
  datasource:
    url: jdbc:h2:file:./data/salarydb;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

app:
  auth:
    username: ${HR_USERNAME:hr.manager}
    password: ${HR_PASSWORD:change-me}